[project]
name = "backend"
version = "0.1.0"
description = "Authoritative backend for the TOMANAP multiplayer word game"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.21.0",
    "alembic>=1.18.5",
    "asyncpg>=0.30.0",
    "fastapi>=0.139.0",
    "opentelemetry-api>=1.43.0",
    "opentelemetry-exporter-otlp-proto-http>=1.43.0",
    "opentelemetry-instrumentation-fastapi>=0.64b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.64b0",
    "opentelemetry-sdk>=1.43.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.10.0",
    "python-dotenv>=1.2.2",
    "redis>=6.4,<8",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx2>=0.1.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.21",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "postgres: requires an available PostgreSQL service",
    "redis: requires an available Redis service",
    "load: opt-in load or soak verification",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S311", "S603"]
